<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Segurança: o app só carrega código, estilos, fontes e imagens dele mesmo.
     Quando o login Google e o Gemini entrarem, os endereços do Google são acrescentados aqui, um a um. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://www.googleapis.com https://oauth2.googleapis.com https://api.crossref.org; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>researchbook</title>
<meta name="theme-color" content="#1F4A5A">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="apple-mobile-web-app-title" content="researchbook">
<link rel="preload" href="fontes/lexend.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Fontes servidas pelo próprio app (licença SIL OFL em public/fontes): funcionam sem internet e não dependem do Google Fonts. */
@font-face{font-family:'Lexend';src:url(fontes/lexend.woff2) format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'Literata';src:url(fontes/literata.woff2) format('woff2');font-weight:200 900;font-style:normal;font-display:swap}
@font-face{font-family:'Literata';src:url(fontes/literata-italico.woff2) format('woff2');font-weight:200 900;font-style:italic;font-display:swap}
</style>
<style>
/* ============ Tokens ============ */
:root{
  --papel:#F4F0E6; --papel-2:#EAE4D5; --cartao:#FBF9F4; --linha:#DDD5C3; --linha-2:#CCC2AC;
  --tinta:#211F1B; --grafite:#5F594E; --grafite-2:#8A8374;
  --petroleo:#1F4A5A; --petroleo-escuro:#153643; --petroleo-claro:#DCE7EA;
  --hl-conceito:#F5D768; --hl-evidencia:#B4DBA2; --hl-metodo:#A9CBEA; --hl-critica:#F2AE9F; --hl-dissert:#D0BDEB;
  --sepia-bg:#F1E3C6; --sepia-tinta:#3A2E1F;
  --ui:'Lexend',system-ui,sans-serif; --leitura:'Literata',Georgia,serif;
  --r-s:6px; --r-m:12px; --r-l:22px;
  --t-xs:12.5px; --t-s:14px; --t-m:15.5px; --t-l:18px; --t-xl:24px; --t-xxl:34px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--ui);font-size:var(--t-m);font-weight:400;color:var(--tinta);background:var(--papel);line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--petroleo);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ============ Shell ============ */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
aside.nav{position:sticky;top:0;height:100vh;overflow-y:auto;padding:26px 18px 20px;display:flex;flex-direction:column;gap:26px;border-right:1px solid var(--linha);background:var(--papel)}
.wordmark{font-weight:600;font-size:21px;letter-spacing:-.02em;padding:0 10px;display:inline-block;position:relative;text-decoration:none}
.wordmark span{position:relative;z-index:1}
.wordmark::after{content:"";position:absolute;left:4px;right:-6px;bottom:3px;height:11px;background:var(--hl-conceito);border-radius:3px 8px 4px 9px;transform:rotate(-1.2deg);z-index:0}
.nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav a.item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:var(--r-s);text-decoration:none;color:var(--grafite);font-size:var(--t-m)}
.nav a.item svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6}
.nav a.item:hover{background:var(--papel-2);color:var(--tinta)}
.nav a.item.ativo{background:var(--tinta);color:var(--papel)}
.nav a.item .qtd{margin-left:auto;font-size:var(--t-xs);color:inherit;opacity:.7}
.nav h4{font-size:var(--t-xs);font-weight:500;color:var(--grafite-2);margin:0 0 8px 10px}
.proj-dot{width:9px;height:9px;border-radius:50%;flex:none}
.nav .rodape{margin-top:auto;font-size:var(--t-xs);color:var(--grafite-2);padding:0 10px;display:flex;flex-direction:column;gap:8px}
.selo-demo{align-self:flex-start;background:var(--papel-2);border:1px dashed var(--linha-2);border-radius:999px;padding:3px 10px;color:var(--grafite)}

main{min-width:0;padding:30px 40px 60px}
.topo{display:flex;align-items:flex-end;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.topo h1{font-size:var(--t-xxl);font-weight:500;letter-spacing:-.025em;line-height:1.1;margin:0}
.topo p{margin:6px 0 0;color:var(--grafite)}
.topo .acoes{margin-left:auto;display:flex;gap:10px;align-items:center}
.busca{display:flex;align-items:center;gap:8px;background:var(--cartao);border:1px solid var(--linha);border-radius:999px;padding:8px 14px;min-width:260px}
.busca input{border:0;background:none;outline:none;width:100%;font-size:var(--t-s)}
.busca svg{width:16px;height:16px;stroke:var(--grafite-2);fill:none;stroke-width:1.8}

/* ============ Buttons & atoms ============ */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--linha-2);background:var(--cartao);border-radius:999px;padding:8px 16px;font-size:var(--t-s);font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--tinta)}
.btn.prim{background:var(--petroleo);border-color:var(--petroleo);color:#fff}
.btn.prim:hover{background:var(--petroleo-escuro)}
.btn.fant{border-color:transparent;background:none}
.btn.fant:hover{background:var(--papel-2)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-xs);padding:2px 9px;border-radius:999px;background:var(--papel-2);color:var(--grafite);white-space:nowrap}
.chip.proj{background:none;border:1px solid var(--linha-2)}
.mute{color:var(--grafite)}
.mute-2{color:var(--grafite-2)}
.pips{display:inline-flex;gap:4px;align-items:center}
.pips i{width:18px;height:6px;border-radius:3px;background:var(--linha)}
.pips i.on{background:var(--petroleo)}
.pips i.agora{background:repeating-linear-gradient(-45deg,var(--petroleo) 0 3px,var(--petroleo-claro) 3px 6px)}
.hlbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--linha);width:100%}
.hlbar span{display:block;height:100%}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.c-conceito{background:var(--hl-conceito)} .c-evidencia{background:var(--hl-evidencia)} .c-metodo{background:var(--hl-metodo)} .c-critica{background:var(--hl-critica)} .c-dissert{background:var(--hl-dissert)}

/* marker look */
mark{color:inherit;padding:.05em .12em;margin:0 -.04em;border-radius:.25em .5em .3em .55em;-webkit-box-decoration-break:clone;box-decoration-break:clone;cursor:pointer;position:relative}
mark.conceito{background:linear-gradient(176deg,transparent 6%,var(--hl-conceito) 7%,var(--hl-conceito) 93%,transparent 94%)}
mark.evidencia{background:linear-gradient(176deg,transparent 6%,var(--hl-evidencia) 7%,var(--hl-evidencia) 93%,transparent 94%)}
mark.metodo{background:linear-gradient(176deg,transparent 6%,var(--hl-metodo) 7%,var(--hl-metodo) 93%,transparent 94%)}
mark.critica{background:linear-gradient(176deg,transparent 6%,var(--hl-critica) 7%,var(--hl-critica) 93%,transparent 94%)}
mark.dissert{background:linear-gradient(176deg,transparent 6%,var(--hl-dissert) 7%,var(--hl-dissert) 93%,transparent 94%)}
mark[data-nota]::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--petroleo);margin-left:4px;vertical-align:.5em}
mark.pulso{animation:pulso 1.2s ease}
@keyframes pulso{0%,100%{filter:none}40%{filter:brightness(.82)}}

/* ============ Painel (bento) ============ */
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.bloco{background:var(--cartao);border:1px solid var(--linha);border-radius:var(--r-m);padding:22px}
.bloco h3{font-size:var(--t-m);font-weight:500;margin:0 0 14px}
.b-hero{grid-column:1/5;grid-row:1/3;border-radius:var(--r-l);padding:32px 36px;display:flex;flex-direction:column;gap:20px}
.b-hero .ref{font-size:var(--t-s);color:var(--grafite)}
.b-hero .ref b{font-weight:500;color:var(--tinta)}
.b-hero blockquote{margin:0;font-family:var(--leitura);font-size:23px;line-height:1.6;max-width:36em;font-weight:400}
.b-hero .pergunta{display:flex;gap:14px;align-items:flex-start;border-top:1px solid var(--linha);padding-top:20px;margin-top:auto}
.b-hero .pergunta .quem{flex:none;width:34px;height:34px;border-radius:50%;background:var(--petroleo-claro);display:grid;place-items:center}
.b-hero .pergunta .quem svg{width:18px;height:18px;stroke:var(--petroleo);fill:none;stroke-width:1.7}
.b-hero .pergunta p{margin:0;font-size:var(--t-m);line-height:1.55}
.b-hero .pergunta small{display:block;color:var(--grafite-2);font-size:var(--t-xs);margin-bottom:3px}
.b-hero .rodape{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.b-hoje{grid-column:5/7}
.b-trilha{grid-column:5/7}
.b-grifos{grid-column:1/3}
.b-arg{grid-column:3/5;background:var(--petroleo);color:#EAF1F3;border-color:var(--petroleo)}
.b-arg h3{color:#fff}
.b-semana{grid-column:5/7}
.lista-hoje{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lista-hoje li{display:flex;gap:12px;align-items:baseline;padding:10px 0;border-top:1px solid var(--linha)}
.lista-hoje li:first-child{border-top:0;padding-top:0}
.lista-hoje .n{font-size:var(--t-l);font-weight:500;min-width:28px}
.lista-hoje a{text-decoration:none}
.lista-hoje a:hover{text-decoration:underline}
.mini-trilha{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.mini-trilha div{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:var(--t-s)}
.mini-trilha span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra{height:8px;border-radius:4px;background:var(--papel-2);overflow:hidden;margin:4px 0 14px}
.barra i{display:block;height:100%;background:var(--petroleo);border-radius:4px}
.dist{display:flex;flex-direction:column;gap:9px}
.dist div{display:grid;grid-template-columns:118px 1fr 26px;align-items:center;gap:10px;font-size:var(--t-s)}
.dist .trilho{height:10px;border-radius:3px 6px 3px 6px;background:var(--papel-2);overflow:hidden}
.dist .trilho i{display:block;height:100%}
.b-arg blockquote{font-family:var(--leitura);font-size:var(--t-l);line-height:1.5;margin:0 0 16px;color:#fff}
.b-arg .meta{font-size:var(--t-s);color:#B9CDD3}
.b-arg .btn{background:transparent;color:#fff;border-color:#5C8391;margin-top:16px}
.semana{display:flex;align-items:flex-end;gap:10px;height:96px;margin-top:8px}
.semana div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:var(--t-xs);color:var(--grafite-2);height:100%;justify-content:flex-end}
.semana i{display:block;width:100%;background:var(--petroleo-claro);border-radius:4px 4px 2px 2px}
.semana div.hoje i{background:var(--petroleo)}
.semana div.hoje{color:var(--tinta);font-weight:500}

/* ============ Biblioteca ============ */
.bib{display:grid;grid-template-columns:220px 1fr;gap:32px;align-items:start}
.facetas{position:sticky;top:24px;display:flex;flex-direction:column;gap:24px}
.facetas h4{font-size:var(--t-s);font-weight:500;margin:0 0 8px}
.facetas button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;padding:5px 8px;border-radius:var(--r-s);font-size:var(--t-s);color:var(--grafite)}
.facetas button:hover{background:var(--papel-2);color:var(--tinta)}
.facetas button.on{background:var(--petroleo-claro);color:var(--petroleo-escuro);font-weight:500}
.facetas button .q{margin-left:auto;font-size:var(--t-xs);opacity:.7}
.filtros-ativos{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;min-height:26px;align-items:center}
.filtros-ativos .chip{background:var(--petroleo-claro);color:var(--petroleo-escuro)}
.filtros-ativos button{background:none;border:0;padding:0 0 0 2px;font-size:14px;line-height:1;color:inherit}
.tabela{background:var(--cartao);border:1px solid var(--linha);border-radius:var(--r-m);overflow:hidden}
.linha-lv{display:grid;grid-template-columns:1fr 150px 150px 110px;gap:24px;align-items:center;padding:18px 22px;border-top:1px solid var(--linha);cursor:pointer}
.linha-lv:first-child{border-top:0}
.linha-lv:hover{background:#fff}
.linha-lv.cab{cursor:default;padding:10px 22px;font-size:var(--t-xs);color:var(--grafite-2);background:var(--papel-2)}
.linha-lv.cab:hover{background:var(--papel-2)}
.linha-lv .tit{font-weight:500;font-size:var(--t-m);line-height:1.35}
.linha-lv .aut{font-size:var(--t-s);color:var(--grafite);margin-top:3px}
.linha-lv .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.linha-lv .est{font-size:var(--t-s);display:flex;flex-direction:column;gap:6px}
.linha-lv .gr{display:flex;flex-direction:column;gap:6px;font-size:var(--t-xs);color:var(--grafite-2)}
.vazio{padding:48px 22px;text-align:center;color:var(--grafite)}

/* ============ Trilhas ============ */
.legenda-etapas{display:flex;gap:22px;flex-wrap:wrap;font-size:var(--t-s);color:var(--grafite);margin-bottom:22px;align-items:center}
.legenda-etapas ol{display:flex;gap:6px;list-style:none;margin:0;padding:0;align-items:center}
.legenda-etapas li{display:flex;align-items:center;gap:6px}
.legenda-etapas li+li::before{content:"";width:16px;height:1px;background:var(--linha-2);margin-right:6px}
.trilha{background:var(--cartao);border:1px solid var(--linha);border-radius:var(--r-l);padding:26px 28px;margin-bottom:20px}
.trilha header{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.trilha h2{font-size:var(--t-xl);font-weight:500;letter-spacing:-.015em;margin:0}
.trilha header p{margin:4px 0 0;color:var(--grafite);font-size:var(--t-s)}
.trilha .prazo{margin-left:auto;text-align:right}
.trilha .prazo b{display:block;font-size:var(--t-l);font-weight:500}
.trilha .prazo small{color:var(--grafite);font-size:var(--t-s)}
.trilha .prazo.urgente b{color:#9A3B26}
.seq{list-style:none;margin:0;padding:0;counter-reset:seq}
.seq li{display:grid;grid-template-columns:34px 1fr 120px 210px;gap:18px;align-items:center;padding:13px 0;border-top:1px solid var(--linha);counter-increment:seq}
.seq li::before{content:counter(seq);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:var(--t-s);border:1px solid var(--linha-2);color:var(--grafite)}
.seq li.feito::before{background:var(--petroleo);border-color:var(--petroleo);color:#fff;content:"✓"}
.seq li.agora::before{border:2px solid var(--petroleo);color:var(--petroleo);font-weight:600}
.seq li.agora{background:linear-gradient(90deg,var(--petroleo-claro),transparent 70%);margin:0 -28px;padding-left:28px;padding-right:28px}
.seq .t{font-weight:500;font-size:var(--t-m)}
.seq .a{font-size:var(--t-s);color:var(--grafite)}
.seq .acao{justify-self:end}

/* ============ Leitor ============ */
.leitor main{padding:0}
.leitor-barra{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--linha);background:var(--papel);flex-wrap:wrap}
.leitor-barra .tit{font-weight:500;font-size:var(--t-s);max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leitor-barra .tit small{display:block;font-weight:400;color:var(--grafite)}
.seg{display:inline-flex;background:var(--papel-2);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:5px 13px;font-size:var(--t-xs);color:var(--grafite)}
.seg button.on{background:var(--cartao);color:var(--tinta);box-shadow:0 1px 2px rgba(60,50,30,.15)}
.leitor-barra .dir{margin-left:auto;display:flex;gap:10px;align-items:center}
.leitor-grid{display:grid;grid-template-columns:250px 1fr 360px;min-height:calc(100vh - 62px)}
.col-grifos{border-right:1px solid var(--linha);padding:20px 16px;overflow:auto;max-height:calc(100vh - 62px);position:sticky;top:62px}
.col-grifos h4,.col-tutor h4{font-size:var(--t-s);font-weight:500;margin:0 0 12px}
.grifo-item{display:block;width:100%;text-align:left;background:none;border:0;border-left:4px solid;padding:6px 0 6px 10px;margin-bottom:10px;font-family:var(--leitura);font-size:13.5px;line-height:1.45;color:var(--tinta)}
.grifo-item small{display:block;font-family:var(--ui);font-size:11.5px;color:var(--grafite-2);margin-top:3px}
.grifo-item:hover{background:var(--papel-2)}
.funcoes{display:flex;flex-direction:column;gap:6px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--linha)}
.funcoes div{display:flex;gap:8px;align-items:center;font-size:var(--t-xs);color:var(--grafite)}
.funcoes div b{font-weight:500;color:var(--tinta);margin-left:auto}
.palco{padding:40px 30px 120px;overflow:auto;transition:background .25s}
.palco.sepia{background:var(--sepia-bg)}
.doc{max-width:680px;margin:0 auto;font-family:var(--leitura);font-size:19px;line-height:1.75;color:var(--tinta)}
.palco.sepia .doc{color:var(--sepia-tinta)}
.doc .aviso-demo{font-family:var(--ui);font-size:var(--t-xs);color:var(--grafite);background:var(--papel-2);border:1px dashed var(--linha-2);border-radius:var(--r-s);padding:8px 12px;margin-bottom:28px;line-height:1.45}
.doc h1{font-family:var(--leitura);font-weight:600;font-size:30px;line-height:1.25;letter-spacing:-.01em;margin:0 0 10px}
.doc .autores{font-family:var(--ui);font-size:var(--t-s);color:var(--grafite);margin-bottom:34px}
.doc h2{font-family:var(--leitura);font-size:21px;font-weight:600;margin:36px 0 10px}
.doc p{margin:0 0 1.1em;hyphens:auto}
.doc .pag{font-family:var(--ui);font-size:11.5px;color:var(--grafite-2);text-align:center;margin:30px 0;display:flex;align-items:center;gap:12px}
.doc .pag::before,.doc .pag::after{content:"";flex:1;height:1px;background:var(--linha)}
/* modo PDF: folha simulada */
.palco.pdf{background:#D9D3C6}
.palco.pdf .doc{background:#fff;max-width:820px;padding:64px 70px;font-size:14.5px;line-height:1.55;column-count:2;column-gap:34px;box-shadow:0 1px 3px rgba(40,30,10,.18),0 10px 30px rgba(40,30,10,.12);text-align:justify;color:#1b1b1b}
.palco.pdf .doc .cabeca{column-span:all}
.palco.pdf .doc h1{font-size:23px;text-align:left}
.palco.pdf .doc h2{font-size:15px;margin:18px 0 6px}
.palco.pdf .doc .pag{column-span:all}
.popover{position:absolute;z-index:30;background:var(--tinta);color:#fff;border-radius:var(--r-m);padding:8px;display:none;gap:6px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.popover.on{display:flex}
.popover .cor{width:26px;height:26px;border-radius:50%;border:2px solid transparent}
.popover .cor:hover{border-color:#fff}
.popover .sep{width:1px;height:22px;background:#4a4640;margin:0 4px}
.popover .btn{background:none;border-color:#4a4640;color:#fff;padding:5px 11px;font-size:var(--t-xs)}
.popover .btn:hover{border-color:#fff}
.dica-cor{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--tinta);color:#fff;font-size:11px;padding:3px 8px;border-radius:4px;white-space:nowrap;display:none}
.col-tutor{border-left:1px solid var(--linha);display:flex;flex-direction:column;max-height:calc(100vh - 62px);position:sticky;top:62px;background:var(--cartao)}
.abas{display:flex;gap:4px;padding:12px 16px 0;border-bottom:1px solid var(--linha)}
.abas button{border:0;background:none;padding:8px 12px 10px;font-size:var(--t-s);color:var(--grafite);border-bottom:2px solid transparent;margin-bottom:-1px}
.abas button.on{color:var(--tinta);border-color:var(--tinta);font-weight:500}
.tutor-corpo{flex:1;overflow:auto;padding:18px 18px 10px;display:flex;flex-direction:column;gap:16px}
.guia{background:var(--papel);border:1px solid var(--linha);border-radius:var(--r-m);padding:14px 16px}
.guia summary{font-size:var(--t-s);font-weight:500;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.guia summary::-webkit-details-marker{display:none}
.guia ol{margin:12px 0 0;padding-left:20px;font-size:var(--t-s);display:flex;flex-direction:column;gap:8px;color:var(--grafite)}
.guia li.ok{color:var(--grafite-2);text-decoration:line-through}
.msg{font-size:var(--t-s);line-height:1.55}
.msg .trecho{font-family:var(--leitura);font-size:13.5px;border-left:3px solid var(--hl-critica);padding:2px 0 2px 10px;margin:6px 0;color:var(--grafite)}
.msg.eu{align-self:flex-end;background:var(--papel-2);border-radius:14px 14px 4px 14px;padding:10px 14px;max-width:90%}
.msg.tutor{display:flex;gap:10px}
.msg.tutor .av{flex:none;width:28px;height:28px;border-radius:50%;background:var(--petroleo-claro);display:grid;place-items:center}
.msg.tutor .av svg{width:15px;height:15px;stroke:var(--petroleo);fill:none;stroke-width:1.8}
.msg.tutor p{margin:0 0 8px}
.msg.tutor p:last-child{margin:0}
.atalhos{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 10px}
.atalhos button{font-size:var(--t-xs);border:1px solid var(--linha-2);background:var(--papel);border-radius:999px;padding:4px 10px;color:var(--grafite)}
.atalhos button:hover{border-color:var(--tinta);color:var(--tinta)}
.entrada{display:flex;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--linha)}
.entrada textarea{flex:1;resize:none;border:1px solid var(--linha-2);border-radius:var(--r-m);padding:9px 12px;font-size:var(--t-s);background:#fff;height:44px}
.entrada button{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--petroleo);display:grid;place-items:center}
.entrada button svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.8}
.notas-lista{display:flex;flex-direction:column;gap:12px}
.nota{border:1px solid var(--linha);border-radius:var(--r-m);padding:12px 14px;background:var(--papel)}
.nota .trecho{font-family:var(--leitura);font-size:13.5px;color:var(--grafite);border-left:3px solid;padding-left:10px;margin-bottom:8px}
.nota p{margin:0;font-size:var(--t-s)}
.nota small{display:block;margin-top:6px;color:var(--grafite-2);font-size:11.5px}

/* ============ Fichamento ============ */
.ref-abnt{font-family:var(--leitura);font-size:var(--t-m);line-height:1.6;background:var(--cartao);border:1px solid var(--linha);border-radius:var(--r-m);padding:14px 18px;margin-bottom:24px;max-width:900px}
.passos{display:flex;list-style:none;margin:0 0 26px;padding:0;gap:0;border:1px solid var(--linha);border-radius:999px;background:var(--cartao);overflow:hidden;max-width:980px}
.passos li{flex:1}
.passos button{width:100%;border:0;background:none;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:center;font-size:var(--t-s);color:var(--grafite);border-left:1px solid var(--linha)}
.passos li:first-child button{border-left:0}
.passos .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--linha-2);font-size:var(--t-xs);flex:none}
.passos button.feito .n{background:var(--petroleo);border-color:var(--petroleo);color:#fff}
.passos button.on{background:var(--tinta);color:var(--papel)}
.passos button.on .n{border-color:var(--papel);color:var(--papel)}
.fich-grid{display:grid;grid-template-columns:260px 1fr 300px;gap:24px;align-items:start}
.painel-lat{background:var(--cartao);border:1px solid var(--linha);border-radius:var(--r-m);padding:18px}
.painel-lat h4{font-size:var(--t-s);font-weight:500;margin:0 0 4px}
.painel-lat .sub{font-size:var(--t-xs);color:var(--grafite-2);margin:0 0 14px}
.editor{background:var(--cartao);border:1px solid var(--linha);border-radius:var(--r-l);padding:28px 32px}
.editor h2{font-size:var(--t-xl);font-weight:500;letter-spacing:-.015em;margin:0 0 6px}
.editor .instr{color:var(--grafite);margin:0 0 22px;max-width:60ch}
.campo{margin-bottom:20px}
.campo label{display:flex;justify-content:space-between;font-size:var(--t-s);font-weight:500;margin-bottom:7px}
.campo label span{font-weight:400;color:var(--grafite-2);font-size:var(--t-xs)}
.campo textarea,.campo input,.campo select{width:100%;border:1px solid var(--linha-2);border-radius:var(--r-s);background:#fff;padding:11px 13px;font-size:var(--t-m);line-height:1.6}
.campo textarea{font-family:var(--leitura);font-size:16.5px;line-height:1.65;min-height:110px;resize:vertical}
.campo textarea:focus,.campo input:focus,.campo select:focus{outline:none;border-color:var(--petroleo);box-shadow:0 0 0 3px var(--petroleo-claro)}
.citacao{border:1px solid var(--linha);border-radius:var(--r-m);padding:16px 18px;margin-bottom:14px;background:#fff}
.citacao blockquote{margin:0 0 6px;font-family:var(--leitura);font-size:16px;line-height:1.6;padding-left:12px;border-left:4px solid}
.citacao .cit{font-size:var(--t-xs);color:var(--grafite);margin-bottom:10px;padding-left:16px}
.citacao textarea{min-height:60px}
.editor .pe{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:18px;border-top:1px solid var(--linha)}
.revisao-tutor{display:flex;flex-direction:column;gap:12px}
.ponto{display:flex;gap:10px;font-size:var(--t-s);line-height:1.5}
.ponto i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px}
.ponto.forte i{background:#5C8F4E}
.ponto.lacuna i{background:#C0702F}
.ponto.pergunta i{background:var(--petroleo)}
.fich-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.fich-card{background:var(--cartao);border:1px solid var(--linha);border-radius:var(--r-m);padding:20px 22px;text-decoration:none;display:flex;flex-direction:column;gap:12px}
.fich-card:hover{border-color:var(--tinta)}
.fich-card .t{font-weight:500;line-height:1.35}
.fich-card .etp{display:flex;gap:4px}
.fich-card .etp i{flex:1;height:5px;border-radius:3px;background:var(--linha)}
.fich-card .etp i.on{background:var(--petroleo)}

/* ============ Argumentos ============ */
.arg-grid{display:grid;grid-template-columns:360px 1fr;gap:28px;align-items:start}
.arg-lista{display:flex;flex-direction:column;gap:10px}
.arg-item{text-align:left;border:1px solid var(--linha);background:var(--cartao);border-radius:var(--r-m);padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.arg-item:hover{border-color:var(--grafite-2)}
.arg-item.on{border-color:var(--tinta);box-shadow:inset 4px 0 0 var(--hl-dissert)}
.arg-item .t{font-weight:500;line-height:1.4;font-size:var(--t-s)}
.arg-item .m{display:flex;gap:10px;font-size:var(--t-xs);color:var(--grafite-2);flex-wrap:wrap}
.forca{display:inline-flex;gap:3px;align-items:center}
.forca i{width:6px;height:12px;border-radius:2px;background:var(--linha)}
.forca i.on{background:var(--petroleo)}
.arg-det{background:var(--cartao);border:1px solid var(--linha);border-radius:var(--r-l);padding:32px 36px}
.arg-det .tese{font-family:var(--leitura);font-size:26px;line-height:1.4;font-weight:500;margin:6px 0 18px;max-width:30em;letter-spacing:-.005em}
.arg-det .meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.arg-det h3{font-size:var(--t-m);font-weight:500;margin:28px 0 12px}
.trecho-d{border-top:1px solid var(--linha);padding:18px 0;display:grid;grid-template-columns:1fr auto;gap:18px}
.trecho-d p{margin:0;font-family:var(--leitura);font-size:17px;line-height:1.7;max-width:62ch}
.trecho-d small{display:block;margin-top:8px;font-size:var(--t-xs);color:var(--grafite)}
.fontes{display:flex;flex-direction:column;gap:8px;font-size:var(--t-s)}
.fontes a{display:flex;gap:10px;align-items:center;text-decoration:none;padding:8px 12px;border:1px solid var(--linha);border-radius:var(--r-s);background:var(--papel)}
.fontes a:hover{border-color:var(--tinta)}
.alerta-tutor{background:var(--petroleo-claro);border-radius:var(--r-m);padding:16px 18px;font-size:var(--t-s);display:flex;gap:12px}
.alerta-tutor svg{flex:none;width:20px;height:20px;stroke:var(--petroleo);fill:none;stroke-width:1.7}

/* ============ Revisão ============ */
.rev-wrap{display:grid;grid-template-columns:1fr 280px;gap:32px;align-items:start;max-width:1100px}
.cartao-rev{perspective:1600px;height:400px}
.cartao-rev .face-wrap{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.cartao-rev.virado .face-wrap{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--cartao);border:1px solid var(--linha);border-radius:var(--r-l);padding:38px 44px;display:flex;flex-direction:column;box-shadow:0 2px 0 var(--linha),0 4px 0 var(--papel-2)}
.face.verso{transform:rotateY(180deg)}
.face .tipo{display:flex;align-items:center;gap:8px;font-size:var(--t-xs);color:var(--grafite)}
.face .q{font-family:var(--leitura);font-size:27px;line-height:1.4;margin:auto 0;max-width:28em}
.face .r{font-family:var(--leitura);font-size:19px;line-height:1.65;margin:20px 0 auto}
.face .origem{font-size:var(--t-xs);color:var(--grafite-2)}
.notas-rev{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}
.notas-rev button{border:1px solid var(--linha-2);background:var(--cartao);border-radius:var(--r-m);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:500;font-size:var(--t-s)}
.notas-rev button small{font-weight:400;color:var(--grafite-2);font-size:var(--t-xs)}
.notas-rev button:hover{border-color:var(--tinta)}
.notas-rev[hidden]{display:none}

/* ============ Ajustes ============ */
.aj{max-width:780px;display:flex;flex-direction:column;gap:20px}
.aj section{background:var(--cartao);border:1px solid var(--linha);border-radius:var(--r-m);padding:24px 26px}
.aj h2{font-size:var(--t-l);font-weight:500;margin:0 0 4px}
.aj section > p{margin:0 0 18px;color:var(--grafite);font-size:var(--t-s)}
.aj .linha2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cor-func{display:grid;grid-template-columns:28px 160px 1fr;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--linha)}
.cor-func:first-of-type{border-top:0}
.cor-func .sw{width:24px;height:24px;border-radius:6px}
.cor-func input{border:1px solid var(--linha-2);border-radius:var(--r-s);padding:7px 10px;font-size:var(--t-s);background:#fff;width:100%}
.aviso{display:flex;gap:10px;font-size:var(--t-s);background:#FBF0D6;border:1px solid #EBD39A;border-radius:var(--r-s);padding:12px 14px;margin-bottom:16px}

/* ============ Modal & toast ============ */
.veu{position:fixed;inset:0;background:rgba(33,31,27,.38);display:none;align-items:flex-start;justify-content:center;padding:6vh 20px;z-index:50;overflow:auto}
.veu.on{display:flex}
.modal{background:var(--papel);border-radius:var(--r-l);width:100%;max-width:720px;padding:30px 34px;box-shadow:0 20px 60px rgba(30,25,15,.3)}
.modal h2{font-size:var(--t-xl);font-weight:500;margin:0 0 4px;letter-spacing:-.015em}
.modal > p{margin:0 0 22px;color:var(--grafite)}
.doi-linha{display:flex;gap:10px}
.doi-linha input{flex:1;border:1px solid var(--linha-2);border-radius:999px;padding:10px 16px;background:#fff;font-size:var(--t-m)}
.meta-enc{margin-top:18px;background:var(--cartao);border:1px solid var(--linha);border-radius:var(--r-m);padding:18px 20px;display:none}
.meta-enc.on{display:block}
.meta-enc .ok{font-size:var(--t-xs);color:#3F7A36;margin-bottom:10px;display:flex;gap:6px;align-items:center}
.solta{border:2px dashed var(--linha-2);border-radius:var(--r-m);padding:22px;text-align:center;color:var(--grafite);font-size:var(--t-s);margin:18px 0}
.chips-ed{display:flex;gap:6px;flex-wrap:wrap;border:1px solid var(--linha-2);border-radius:var(--r-s);padding:8px;background:#fff}
.chips-ed .chip{background:var(--petroleo-claro);color:var(--petroleo-escuro)}
.chips-ed input{border:0;outline:none;flex:1;min-width:120px;font-size:var(--t-s);padding:2px 4px}
.modal .pe{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--tinta);color:#fff;padding:11px 18px;border-radius:999px;font-size:var(--t-s);opacity:0;pointer-events:none;transition:all .25s;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}


/* ============ Menu em grupos ============ */
.nav li.grupo{font-size:var(--t-xs);font-weight:500;color:var(--grafite-2);margin:16px 0 4px 10px}
.nav a.item{padding:8px 10px}

/* ============ Modo foco (leitor) ============ */
body.foco .app{grid-template-columns:1fr}
body.foco aside.nav{display:none}
.leitor-grid.sem-grifos{grid-template-columns:1fr 360px}
.leitor-grid.sem-tutor{grid-template-columns:250px 1fr}
.leitor-grid.sem-grifos.sem-tutor{grid-template-columns:1fr}
.leitor-grid.sem-grifos .col-grifos,.leitor-grid.sem-tutor .col-tutor{display:none}
.fechar-folha{display:none}
.alterna{display:inline-flex;gap:4px}
.alterna button{width:34px;height:34px;border-radius:8px;border:1px solid var(--linha-2);background:var(--cartao);display:grid;place-items:center;color:var(--grafite);padding:0}
.alterna button:hover{border-color:var(--tinta);color:var(--tinta)}
.alterna button[aria-pressed="true"]{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.alterna svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7}
body.foco .palco{padding-top:56px}

/* ============ Revisão do projeto ============ */
.versao{display:flex;gap:20px;align-items:center;background:var(--cartao);border:1px solid var(--linha);border-radius:var(--r-l);padding:20px 24px;margin-bottom:24px;flex-wrap:wrap}
.pdf-ic{width:42px;height:52px;border-radius:4px 12px 4px 4px;background:#fff;border:1px solid var(--linha-2);display:grid;place-items:center;font-size:10.5px;font-weight:600;color:#9A3B26;flex:none}
.versao .info b{display:block;font-weight:500}
.versao .info span{font-size:var(--t-s);color:var(--grafite)}
.versoes{display:flex;gap:6px;align-items:center;margin-left:auto;font-size:var(--t-xs);color:var(--grafite-2)}
.versoes button{border:1px solid var(--linha-2);background:none;border-radius:999px;padding:4px 11px;font-size:var(--t-xs);color:var(--grafite)}
.versoes button.on{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.proj-grid{display:grid;grid-template-columns:1fr 330px;gap:26px;align-items:start}
.lado{display:flex;flex-direction:column;gap:16px;position:sticky;top:24px}
.prio-grupo{background:var(--cartao);border:1px solid var(--linha);border-radius:var(--r-m);margin-bottom:18px;overflow:hidden}
.prio-grupo > header{display:flex;align-items:center;gap:12px;padding:16px 20px;flex-wrap:wrap}
.prio-grupo h3{font-size:var(--t-l);font-weight:500;margin:0}
.prio-grupo header p{margin:0;color:var(--grafite);font-size:var(--t-s)}
.prio{display:inline-flex;gap:3px;align-items:flex-end;height:14px}
.prio i{width:5px;border-radius:2px;background:var(--linha)}
.prio i:nth-child(1){height:6px}.prio i:nth-child(2){height:10px}.prio i:nth-child(3){height:14px}
.prio i.on{background:var(--tinta)}
.ref-linha{display:grid;grid-template-columns:1fr 170px 150px;gap:22px;padding:16px 20px;border-top:1px solid var(--linha);align-items:start}
.ref-linha .t{font-weight:500;line-height:1.35}
.ref-linha .a{font-size:var(--t-s);color:var(--grafite);margin-top:2px}
.ref-linha .porque{font-size:var(--t-s);color:var(--tinta);margin-top:10px;display:flex;gap:8px;line-height:1.5;max-width:62ch}
.ref-linha .porque svg{flex:none;width:16px;height:16px;stroke:var(--petroleo);fill:none;stroke-width:1.8;margin-top:2px}
.onde{display:flex;flex-direction:column;gap:5px;font-size:var(--t-xs);color:var(--grafite)}
.onde b{font-size:var(--t-l);font-weight:500;color:var(--tinta);line-height:1}
.st-bib{display:flex;flex-direction:column;gap:7px;font-size:var(--t-xs);color:var(--grafite);align-items:flex-start}
.st-bib .fora{color:#9A3B26;font-weight:500}
.st-bib .btn{padding:4px 11px;font-size:var(--t-xs)}
.lado .bloco h3{margin-bottom:10px}
.lado ol,.lado ul{margin:0;padding-left:18px;font-size:var(--t-s);display:flex;flex-direction:column;gap:9px}
.lado .bloco p{font-size:var(--t-s);margin:0 0 10px;color:var(--grafite)}
.inc li span{display:block;color:var(--grafite-2);font-size:var(--t-xs)}
.cta-trilha{background:var(--petroleo);color:#EAF1F3;border-color:var(--petroleo)}
.cta-trilha h3{color:#fff}
.cta-trilha p{color:#C2D5DA!important}
.cta-trilha .btn{background:#fff;color:var(--petroleo-escuro);border-color:#fff;width:100%;justify-content:center}

/* ============ Orientação ============ */
.ori-grid{display:grid;grid-template-columns:1fr 340px;gap:28px;align-items:start}
.tipos-add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;align-items:center}
.tipos-add span{font-size:var(--t-s);color:var(--grafite);margin-right:4px}
.timeline{position:relative;padding-left:30px}
.timeline::before{content:"";position:absolute;left:8px;top:10px;bottom:10px;width:2px;background:var(--linha)}
.encontro{position:relative;background:var(--cartao);border:1px solid var(--linha);border-radius:var(--r-m);padding:22px 26px;margin-bottom:16px}
.encontro::before{content:"";position:absolute;left:-29px;top:26px;width:12px;height:12px;border-radius:50%;background:var(--papel);border:3px solid var(--petroleo)}
.encontro header{display:flex;gap:10px 14px;align-items:baseline;flex-wrap:wrap;margin-bottom:14px}
.encontro h3{font-size:var(--t-l);font-weight:500;margin:0}
.encontro .data{color:var(--grafite);font-size:var(--t-s)}
.encontro .chips{display:flex;gap:6px;margin-left:auto}
.encontro > p{margin:0 0 12px;font-size:var(--t-m);max-width:68ch}
.audio{display:flex;align-items:center;gap:14px;background:var(--papel);border:1px solid var(--linha);border-radius:999px;padding:7px 18px 7px 7px;margin-bottom:16px}
.audio .play{width:34px;height:34px;border-radius:50%;background:var(--petroleo);border:0;display:grid;place-items:center;flex:none;padding:0}
.audio .play svg{width:14px;height:14px}
.onda{flex:1;display:flex;align-items:center;gap:2px;height:30px;min-width:0;overflow:hidden}
.onda i{flex:1;background:var(--linha-2);border-radius:2px;min-width:2px}
.onda i.tocado{background:var(--petroleo)}
.audio small{font-size:var(--t-xs);color:var(--grafite);white-space:nowrap}
.resumo-ia{display:flex;gap:10px;background:var(--petroleo-claro);border-radius:var(--r-m);padding:14px 16px;font-size:var(--t-s);line-height:1.55;margin-bottom:14px}
.resumo-ia svg{flex:none;width:18px;height:18px;stroke:var(--petroleo);fill:none;stroke-width:1.7}
.resumo-ia b{font-weight:500;display:block;margin-bottom:2px}
.transcricao{font-family:var(--leitura);font-size:16px;line-height:1.6;border-left:3px solid var(--linha-2);padding-left:14px;color:var(--grafite);margin:0 0 14px;max-width:62ch}

.combinados{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.combinados li{display:flex;gap:10px;font-size:var(--t-s);align-items:flex-start;line-height:1.45}

.aviso-demo-pg{font-size:var(--t-xs);color:var(--grafite);background:var(--papel-2);border:1px dashed var(--linha-2);border-radius:var(--r-s);padding:8px 12px;margin-bottom:20px;max-width:900px}

.ori-grid > *,.proj-grid > *,.arg-grid > *,.fich-grid > *{min-width:0}
@media (max-width:640px){.timeline{padding-left:22px}.encontro{padding:18px}.encontro::before{left:-21px}.encontro .chips{margin-left:0}.audio small{display:none}}
/* ============ Disciplinas ============ */
.disc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.disc{background:var(--cartao);border:1px solid var(--linha);border-radius:var(--r-l);padding:24px;display:flex;flex-direction:column;gap:14px}
.disc h2{font-size:var(--t-l);font-weight:500;margin:0;line-height:1.3}
.disc .prof{font-size:var(--t-s);color:var(--grafite);margin-top:3px}
.disc .entrega{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-top:1px solid var(--linha);padding-top:14px;font-size:var(--t-s)}
.disc .entrega b{font-weight:500;white-space:nowrap}
.disc .entrega b.urg{color:#9A3B26}
.disc .acoes{display:flex;gap:8px;flex-wrap:wrap}
.disc.nova{border:2px dashed var(--linha-2);background:none;align-items:center;justify-content:center;text-align:center;color:var(--grafite);min-height:260px;font-size:var(--t-s)}
.disc.nova b{display:block;color:var(--tinta);font-size:var(--t-l);font-weight:500;margin-bottom:6px}
.tipo-reg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tipo-reg button{border:1px solid var(--linha-2);background:var(--cartao);border-radius:999px;padding:6px 14px;font-size:var(--t-s)}
.tipo-reg button.on{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:var(--t-s);margin-bottom:18px}
.check input{accent-color:var(--petroleo);width:16px;height:16px;margin-top:2px}

/* ============ Escrita ============ */
.leg-a{display:flex;gap:12px;font-size:var(--t-xs);color:var(--grafite);flex-wrap:wrap}
.leg-a span{display:inline-flex;align-items:center;gap:5px}
.leg-a i{width:14px;height:8px;border-radius:2px;display:inline-block}
.a-autor{background:var(--tinta)} .a-co{background:var(--petroleo)} .a-ia{background:repeating-linear-gradient(-45deg,var(--petroleo) 0 3px,#A9C3CB 3px 6px)}
.barra-wrap{position:relative}
.barra-a{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--linha)}
.barra-a span{display:block;height:100%}
.meta-l{position:absolute;top:-4px;bottom:-4px;width:2px;background:#9A3B26;border-radius:1px}
.txt-lista{display:flex;flex-direction:column;gap:14px;max-width:1180px}
.txt-card{display:grid;grid-template-columns:1fr 190px 240px;gap:28px;align-items:center;background:var(--cartao);border:1px solid var(--linha);border-radius:var(--r-m);padding:20px 24px;text-decoration:none}
.txt-card:hover{border-color:var(--tinta)}
.txt-card .t{font-weight:500;font-size:var(--t-l);line-height:1.35}
.txt-card .m{font-size:var(--t-s);color:var(--grafite);margin-top:4px}
.txt-card .et{font-size:var(--t-s);display:flex;flex-direction:column;gap:6px}
.autoria{display:flex;flex-direction:column;gap:7px;font-size:var(--t-xs);color:var(--grafite)}
.autoria b{font-weight:500;color:var(--tinta)}
.papeis{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:26px;max-width:1180px}
.papel{border:1px solid var(--linha);border-radius:var(--r-m);padding:16px 18px;background:var(--cartao);display:flex;gap:12px;font-size:var(--t-s)}
.papel b{display:block;font-weight:500;font-size:var(--t-m);margin-bottom:2px}
.papel svg{flex:none;width:22px;height:22px;stroke:var(--petroleo);fill:none;stroke-width:1.7}
.passos.seis{max-width:1180px}
.qa{border-top:1px solid var(--linha);padding:18px 0}
.qa:first-of-type{border-top:0;padding-top:0}
.qa .q{font-weight:500;margin-bottom:8px}
.qa .r{font-family:var(--leitura);font-size:17px;line-height:1.65;max-width:62ch}
.qa .r small{display:block;font-family:var(--ui);font-size:var(--t-xs);color:var(--grafite-2);margin-bottom:2px}
.qa.pendente{background:var(--petroleo-claro);border-radius:var(--r-m);padding:18px 20px;border:0;margin-top:6px}
.qa.pendente .q{display:flex;gap:10px}
.qa.pendente svg{flex:none;width:18px;height:18px;stroke:var(--petroleo);fill:none;stroke-width:1.7;margin-top:2px}
.tese-box{border:1px solid var(--linha-2);border-radius:var(--r-m);padding:20px 22px;background:#fff;margin-top:22px}
.tese-box small{display:block;font-size:var(--t-xs);color:var(--grafite-2);margin-bottom:6px}
.tese-box p{margin:0;font-family:var(--leitura);font-size:21px;line-height:1.5}
.diag-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:1180px}
.diag{background:var(--cartao);border:1px solid var(--linha);border-radius:var(--r-m);padding:20px}
.diag h3{display:flex;align-items:center;gap:9px;font-size:var(--t-m);font-weight:500;margin:0 0 4px}
.diag h3 i{width:10px;height:10px;border-radius:50%}
.diag > p{margin:0 0 14px;font-size:var(--t-xs);color:var(--grafite-2)}
.diag-item{border-top:1px solid var(--linha);padding:12px 0;font-size:var(--t-s)}
.diag-item b{display:block;font-weight:500;margin-bottom:4px;line-height:1.4}
.diag-item span{color:var(--grafite);font-size:var(--t-xs);display:block}
.diag-item .btn{margin-top:8px;padding:4px 11px;font-size:var(--t-xs)}
.nota-grounding{display:flex;gap:10px;font-size:var(--t-s);background:var(--papel-2);border-radius:var(--r-m);padding:14px 16px;margin-top:18px;max-width:1180px}
.nota-grounding svg{flex:none;width:18px;height:18px;stroke:var(--petroleo);fill:none;stroke-width:1.7}
.estr{list-style:none;margin:0;padding:0;counter-reset:est;max-width:1000px}
.estr li{display:grid;grid-template-columns:34px 1fr 150px 140px;gap:18px;align-items:start;padding:16px 0;border-top:1px solid var(--linha);counter-increment:est}
.estr li::before{content:counter(est);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:var(--t-s);border:1px solid var(--linha-2);color:var(--grafite)}
.estr .t{font-weight:500}
.estr .o{font-size:var(--t-s);color:var(--grafite);margin-top:3px}
.estr .f{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.estr .chip.lac{background:#F7E3D5;color:#8A4A22}
.estr .x{font-size:var(--t-s);color:var(--grafite)}
.esc-grid{display:grid;grid-template-columns:230px 1fr 330px;gap:22px;align-items:start}
.esc-grid > *{min-width:0}
.secoes{display:flex;flex-direction:column;gap:2px;margin-bottom:20px}
.secoes button{display:flex;gap:9px;align-items:center;text-align:left;background:none;border:0;border-radius:var(--r-s);padding:7px 8px;font-size:var(--t-s);color:var(--grafite)}
.secoes button.on{background:var(--petroleo-claro);color:var(--petroleo-escuro);font-weight:500}
.secoes i{width:8px;height:8px;border-radius:50%;flex:none;border:1.5px solid var(--grafite-2)}
.secoes i.feita{background:var(--petroleo);border-color:var(--petroleo)}
.secoes i.and{background:linear-gradient(90deg,var(--petroleo) 50%,transparent 50%);border-color:var(--petroleo)}
.folha{background:var(--cartao);border:1px solid var(--linha);border-radius:var(--r-l);overflow:hidden}
.folha-barra{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:12px 22px;border-bottom:1px solid var(--linha);background:var(--papel);font-size:var(--t-xs);color:var(--grafite)}
.folha-barra .aut-mini{display:flex;align-items:center;gap:8px;min-width:200px}
.folha-barra .aut-mini .barra-wrap{width:110px}
.folha-barra label{display:flex;gap:6px;align-items:center;margin-left:auto;cursor:pointer}
.folha-barra input{accent-color:var(--petroleo)}
.folha-corpo{padding:30px 36px 40px}
.folha-corpo h2{font-family:var(--leitura);font-weight:600;font-size:23px;margin:0 0 20px}
.par{font-family:var(--leitura);font-size:18px;line-height:1.75;padding:2px 0 2px 18px;border-left:3px solid transparent;margin:0 0 1.1em;max-width:66ch}
.par .tag-a{display:none;font-family:var(--ui);font-size:11px;color:var(--grafite-2);margin-bottom:2px}
.marcas .par.autor{border-left-color:var(--tinta)}
.marcas .par.co{border-left-color:var(--petroleo)}
.marcas .par.ia{border-left:3px dashed var(--petroleo)}
.marcas .par .tag-a{display:block}
.par.ativo{background:#fff;outline:1px solid var(--linha);border-radius:0 10px 10px 0;padding-top:8px;padding-bottom:8px}
.cit-in{border-bottom:1.5px dotted var(--petroleo);color:var(--petroleo-escuro);cursor:help;white-space:nowrap}
.sem-fonte{text-decoration:underline wavy #C0702F;text-decoration-thickness:1.5px;text-underline-offset:5px}
.versoes-box{margin:-6px 0 22px 18px;border:1px solid var(--linha-2);border-radius:var(--r-m);background:var(--papel);padding:16px 18px;max-width:calc(66ch + 18px)}
.versoes-box h4{font-size:var(--t-s);font-weight:500;margin:0 0 10px}
.versoes-box .alerta{display:flex;gap:9px;font-size:var(--t-s);background:#FBF0D6;border:1px solid #EBD39A;border-radius:var(--r-s);padding:10px 12px;margin-bottom:6px;line-height:1.5}
.versao-op{border-top:1px solid var(--linha);padding:14px 0 4px}
.versao-op .cab{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:var(--t-xs);color:var(--grafite)}
.versao-op .cab b{font-weight:500;color:var(--tinta);font-size:var(--t-s);margin-right:4px}
.versao-op p{font-family:var(--leitura);font-size:16.5px;line-height:1.65;margin:8px 0 10px}
.versao-op .bts{display:flex;gap:8px;flex-wrap:wrap}
.versao-op .bts .btn{padding:5px 12px;font-size:var(--t-xs)}
.revs{display:flex;flex-direction:column;max-width:900px}
.rev-it{display:grid;grid-template-columns:28px 1fr auto;gap:14px;align-items:start;padding:14px 0;border-top:1px solid var(--linha)}
.rev-it:first-child{border-top:0}
.rev-it .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600}
.rev-it .ic.ok{background:#DDEBD6;color:#3F7A36}
.rev-it .ic.at{background:#F7E3D5;color:#9A4A1F}
.rev-it .ic.obs{background:var(--petroleo-claro);color:var(--petroleo)}
.rev-it b{font-weight:500;display:block}
.rev-it span{font-size:var(--t-s);color:var(--grafite)}
.refs-abnt{font-family:var(--leitura);font-size:15px;line-height:1.6;display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}

/* ============ Diálogos ============ */
.dlg-grid{display:grid;grid-template-columns:260px 1fr 320px;gap:22px;align-items:start}
.dlg-grid > *{min-width:0}
.dlg-item{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;background:var(--cartao);border:1px solid var(--linha);border-radius:var(--r-m);padding:14px 16px;margin-bottom:10px}
.dlg-item.on{border-color:var(--tinta)}
.dlg-item b{font-weight:500;font-size:var(--t-s);line-height:1.4}
.dlg-item span{font-size:var(--t-xs);color:var(--grafite-2)}
.conversa-card{background:var(--cartao);border:1px solid var(--linha);border-radius:var(--r-l);display:flex;flex-direction:column;min-height:600px}
.conversa-card > header{padding:20px 24px;border-bottom:1px solid var(--linha);display:flex;flex-direction:column;gap:10px}
.conversa-card h2{font-family:var(--leitura);font-size:22px;font-weight:500;margin:0;line-height:1.35}
.conversa-card .linha-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.conversa-card .corpo{flex:1;padding:22px 24px;display:flex;flex-direction:column;gap:18px}
.conversa-card .corpo .msg{font-size:var(--t-m);max-width:62ch}
.conversa-card .corpo .msg.eu{max-width:80%}
.pos{border:1px solid var(--linha);border-left:4px solid var(--hl-dissert);border-radius:var(--r-s);padding:12px 14px;background:#fff;font-family:var(--leitura);font-size:15.5px;line-height:1.55;margin-bottom:10px}
.pos .bts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;font-family:var(--ui)}
.pos .bts .btn{padding:4px 10px;font-size:var(--t-xs)}

/* ============ Overview do autor ============ */
.aut-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.aut-grid > *{min-width:0}
.aut-estilo{grid-column:1/5;border-radius:var(--r-l);padding:30px 34px}

.aut-metr{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:0}
.aut-metr > div{padding:20px 22px;border-left:1px solid var(--linha)}
.aut-metr > div:first-child{border-left:0}
.aut-metr b{display:block;font-size:var(--t-xl);font-weight:500;letter-spacing:-.01em}
.aut-metr span{font-size:var(--t-s);color:var(--grafite)}
.aut-metr small{display:block;font-size:var(--t-xs);color:var(--grafite-2);margin-top:6px}
.aut-temas,.aut-termos,.aut-evol{grid-column:span 2}
.aut-obs,.aut-uso{grid-column:span 3}
.corpus-lista{list-style:none;margin:0 0 14px;padding:0;font-size:var(--t-s);display:flex;flex-direction:column;gap:8px}

.termos{display:flex;flex-wrap:wrap;gap:6px}

.evol{display:flex;flex-direction:column;gap:12px}
.evol > div{font-size:var(--t-xs);color:var(--grafite);display:flex;flex-direction:column;gap:5px}

/* ============ Memória ============ */
.camadas{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:var(--cartao);border:1px solid var(--linha);border-radius:var(--r-l);margin-bottom:24px;overflow:hidden}

.camada:first-child{border-left:0}

.camada b{display:block;font-weight:500;margin-bottom:4px}
.camada p{margin:0;font-size:var(--t-s);color:var(--grafite)}
.camada .q{font-size:var(--t-xs);color:var(--grafite-2);margin-top:10px}
.mem-grid{display:grid;grid-template-columns:1fr 380px;gap:26px;align-items:start}
.mem-grid > *{min-width:0}
.sug{background:var(--petroleo-claro);border-radius:var(--r-m);padding:18px 20px;margin-bottom:22px}
.sug h3{font-size:var(--t-m);font-weight:500;margin:0 0 12px}

.sug-it:first-of-type{border-top:0}
.sug-it small{display:block;color:var(--grafite);font-size:var(--t-xs);margin-top:2px}
.sug-it .bts{display:flex;gap:6px;flex-wrap:wrap}
.sug-it .btn{padding:4px 11px;font-size:var(--t-xs)}
.mem-cat{background:var(--cartao);border:1px solid var(--linha);border-radius:var(--r-m);margin-bottom:14px}
.mem-cat summary{list-style:none;cursor:pointer;padding:14px 20px;display:flex;justify-content:space-between;font-weight:500}
.mem-cat summary::-webkit-details-marker{display:none}
.mem-cat summary span{font-weight:400;color:var(--grafite-2);font-size:var(--t-s)}
.mem-it{display:grid;grid-template-columns:1fr auto;gap:14px;padding:12px 20px;border-top:1px solid var(--linha);font-size:var(--t-s);align-items:center}

.mem-it:hover .bts{opacity:1}
.mem-it .btn{padding:4px 9px;font-size:var(--t-xs)}
.opcoes{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.opcoes label{display:flex;gap:10px;align-items:flex-start;font-size:var(--t-s);cursor:pointer}
.opcoes label small{display:block;color:var(--grafite-2);font-size:var(--t-xs)}
.opcoes input{accent-color:var(--petroleo);margin-top:3px}
pre.prev{background:#fff;border:1px solid var(--linha);border-radius:var(--r-s);padding:12px 14px;font-size:12px;line-height:1.55;white-space:pre-wrap;color:var(--grafite);max-height:230px;overflow:auto;margin:0 0 16px}
pre.arvore{background:#fff;border:1px solid var(--linha);border-radius:var(--r-s);padding:14px 16px;font-size:12.5px;line-height:1.6;color:var(--tinta);overflow:auto;margin:0 0 14px}

.aside-scroll{overflow-y:auto}


/* ============ v0.4: navegação, seções, Hoje ============ */

.salvo.pendente i{background:var(--linha-2)}
.sec-cab{margin-bottom:22px}
.sec-cab h1{font-size:var(--t-xxl);font-weight:500;letter-spacing:-.025em;line-height:1.1;margin:0 0 14px}
.subnav{display:flex;gap:4px;border-bottom:1px solid var(--linha)}
.subnav a{padding:9px 14px 11px;font-size:var(--t-m);color:var(--grafite);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.subnav a:hover{color:var(--tinta)}
.subnav a.on{color:var(--tinta);border-color:var(--tinta);font-weight:500}
.sec-cab + .topo{margin-top:-4px;margin-bottom:22px}
.sec-cab + .topo p{margin-top:0}
.voltar{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-s);color:var(--grafite);text-decoration:none;margin-bottom:10px}
.voltar svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.voltar:hover{color:var(--tinta)}

/* Hoje */
.hoje-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;align-items:start}
.proximo{background:var(--cartao);border:1px solid var(--linha);border-radius:var(--r-l);padding:32px 36px;display:flex;flex-direction:column;gap:20px}
.proximo .rot{font-size:var(--t-s);color:var(--grafite)}
.proximo .rot b{font-weight:500;color:var(--tinta)}
.proximo blockquote{margin:0;font-family:var(--leitura);font-size:23px;line-height:1.6;max-width:36em}
.proximo .acao-l{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.proximo .acao-l span{font-size:var(--t-s);color:var(--grafite)}
.proximo .btn.prim{padding:11px 22px;font-size:var(--t-m)}
.pergunta-t{display:flex;gap:14px;align-items:flex-start;border-top:1px solid var(--linha);padding-top:20px}
.pergunta-t .quem{flex:none;width:34px;height:34px;border-radius:50%;background:var(--petroleo-claro);display:grid;place-items:center}
.pergunta-t .quem svg{width:18px;height:18px;stroke:var(--petroleo);fill:none;stroke-width:1.7}
.pergunta-t p{margin:0;line-height:1.55}
.pergunta-t small{display:block;color:var(--grafite-2);font-size:var(--t-xs);margin-bottom:3px}
.tambem{background:var(--cartao);border:1px solid var(--linha);border-radius:var(--r-m);padding:20px 22px}
.tambem h2{font-size:var(--t-m);font-weight:500;margin:0 0 6px}
.tambem a{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:13px 0;border-top:1px solid var(--linha);text-decoration:none}
.tambem a:first-of-type{border-top:0}
.tambem a b{font-weight:500}
.tambem a span{grid-column:1;font-size:var(--t-s);color:var(--grafite)}
.tambem a svg{grid-row:1/3;grid-column:2;align-self:center;width:16px;height:16px;stroke:var(--grafite-2);fill:none;stroke-width:1.8}
.tambem a:hover b{text-decoration:underline}
.tambem .urg{color:#9A3B26}
.semana-det{margin-top:18px;background:none}
.semana-det > summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:8px;font-size:var(--t-s);color:var(--grafite);padding:8px 0}
.semana-det > summary::-webkit-details-marker{display:none}
.semana-det > summary::before{content:"";width:7px;height:7px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);transition:transform .2s}
.semana-det[open] > summary::before{transform:rotate(45deg)}
.semana-det .bento{margin-top:10px}

/* Leitor v0.4 */
.alterna button.txt{width:auto;padding:0 12px;gap:7px;display:inline-flex;align-items:center;font-size:var(--t-xs);font-weight:500}
.aa{position:relative}
.aa > summary{list-style:none;cursor:pointer;height:34px;padding:0 12px;border:1px solid var(--linha-2);border-radius:8px;display:inline-flex;align-items:center;font-family:var(--leitura);font-size:15px;background:var(--cartao)}
.aa > summary::-webkit-details-marker{display:none}
.aa[open] > summary{border-color:var(--tinta)}
.aa-menu{position:absolute;right:0;top:40px;z-index:20;background:var(--cartao);border:1px solid var(--linha-2);border-radius:var(--r-m);padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px rgba(40,30,10,.15);min-width:250px}
.aa-menu label{font-size:var(--t-xs);color:var(--grafite-2);display:block;margin-bottom:6px}
.popover{flex-direction:column;align-items:stretch;gap:8px;padding:10px}
.popover .linha-p{display:flex;gap:6px;align-items:center}
.popover .cor-n{display:inline-flex;align-items:center;gap:7px;border:1px solid #4a4640;background:none;color:#fff;border-radius:999px;padding:4px 10px 4px 5px;font-size:12px}
.popover .cor-n:hover{border-color:#fff}
.popover .cor-n i{width:16px;height:16px;border-radius:50%;display:inline-block}

/* Biblioteca v0.4 */
.filtros-barra{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filtro{position:relative}
.filtro > summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--linha-2);background:var(--cartao);border-radius:999px;padding:6px 14px;font-size:var(--t-s)}
.filtro > summary::-webkit-details-marker{display:none}
.filtro > summary::after{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px)}
.filtro.ativo > summary{background:var(--petroleo-claro);border-color:var(--petroleo-claro);color:var(--petroleo-escuro);font-weight:500}
.filtro-menu{position:absolute;top:40px;left:0;z-index:15;background:var(--cartao);border:1px solid var(--linha-2);border-radius:var(--r-m);padding:8px;min-width:240px;box-shadow:0 10px 30px rgba(40,30,10,.15);display:flex;flex-direction:column}
.filtro-menu button{display:flex;align-items:center;gap:9px;text-align:left;background:none;border:0;padding:7px 9px;border-radius:var(--r-s);font-size:var(--t-s);color:var(--tinta)}
.filtro-menu button:hover{background:var(--papel-2)}
.filtro-menu button.on{background:var(--petroleo-claro);font-weight:500}
.filtro-menu button .q{margin-left:auto;font-size:var(--t-xs);color:var(--grafite-2)}
.linha-lv{grid-template-columns:1fr 160px 130px}
.linha-lv .prog{font-size:var(--t-s);color:var(--grafite);display:flex;flex-direction:column;gap:3px}
.linha-lv .prog small{font-size:var(--t-xs);color:var(--grafite-2)}
.concluidas{margin-top:6px}
.concluidas > summary{cursor:pointer;font-size:var(--t-s);color:var(--grafite);padding:10px 0;list-style:none;display:inline-flex;gap:8px;align-items:center}
.concluidas > summary::-webkit-details-marker{display:none}
.concluidas > summary::before{content:"";width:7px;height:7px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg)}
.concluidas[open] > summary::before{transform:rotate(45deg)}
.seq.feitas li::before{background:var(--petroleo);border-color:var(--petroleo);color:#fff;content:"✓"}

/* Revisão do projeto v0.4 */
details.prio-grupo > summary{list-style:none;cursor:pointer}
details.prio-grupo > summary::-webkit-details-marker{display:none}
details.prio-grupo > summary header::after{content:"Mostrar";margin-left:auto;font-size:var(--t-xs);color:var(--grafite);border:1px solid var(--linha-2);border-radius:999px;padding:3px 10px}
details.prio-grupo[open] > summary header::after{content:"Ocultar"}
.ajuda-det > summary{cursor:pointer;font-size:var(--t-s);color:var(--petroleo-escuro);list-style:none}
.ajuda-det > summary::-webkit-details-marker{display:none}
.ajuda-det ol{margin-top:12px!important}

/* Orientação v0.4 */
.encontro details > summary{cursor:pointer;font-size:var(--t-s);color:var(--petroleo-escuro);list-style:none;margin-top:-4px}
.encontro details > summary::-webkit-details-marker{display:none}
.encontro details[open] > summary{margin-bottom:12px}
.encontro .resumo-l{font-size:var(--t-s);color:var(--grafite);margin:-6px 0 10px}

/* Escrita v0.4 */
.txt-card .st{display:inline-flex;align-items:center;gap:7px;font-size:var(--t-s)}
.txt-card .st i{width:8px;height:8px;border-radius:50%}
.esc-cab{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.esc-cab h1{font-size:28px;font-weight:500;letter-spacing:-.02em;line-height:1.15;margin:0;max-width:30em}
.esc-cab p{margin:6px 0 0;color:var(--grafite)}
.esc-cab .acoes{margin-left:auto;display:flex;gap:10px}
.esc-grid{grid-template-columns:210px minmax(0,1fr) 330px}
.abas-lat{display:flex;gap:4px;border-bottom:1px solid var(--linha);margin:-4px -4px 14px}
.abas-lat button{border:0;background:none;padding:6px 10px 9px;font-size:var(--t-s);color:var(--grafite);border-bottom:2px solid transparent;margin-bottom:-1px}
.abas-lat button.on{color:var(--tinta);border-color:var(--tinta);font-weight:500}
.passos.quatro{max-width:900px}
.setup-intro{font-size:var(--t-s);color:var(--grafite);margin:-12px 0 20px;max-width:900px}

/* Cartões: fim de sessão */
.fim-sessao{background:var(--cartao);border:1px solid var(--linha);border-radius:var(--r-l);padding:40px 44px;max-width:760px}
.fim-sessao h2{font-family:var(--leitura);font-weight:500;font-size:28px;margin:0 0 10px}
.fim-sessao p{color:var(--grafite);margin:0 0 22px;max-width:52ch}
.fim-sessao .num{display:flex;gap:36px;margin-bottom:26px;flex-wrap:wrap}
.fim-sessao .num div{font-size:var(--t-s);color:var(--grafite)}
.fim-sessao .num b{display:block;font-size:var(--t-xl);font-weight:500;color:var(--tinta)}

/* Toast com desfazer */
.toast{display:flex;gap:14px;align-items:center;pointer-events:none}
.toast.on{pointer-events:auto}
.toast button{background:none;border:0;color:#BFD6DC;font-weight:600;font-size:var(--t-s);padding:0;text-decoration:underline}

/* Busca rápida */
.busca-modal{max-width:620px;padding:16px}
.busca-modal input{width:100%;border:0;border-bottom:1px solid var(--linha);background:none;padding:10px 8px 14px;font-size:var(--t-l);outline:none}
.res-busca{display:flex;flex-direction:column;max-height:380px;overflow:auto;margin-top:8px}
.res-busca a{display:flex;gap:12px;align-items:baseline;padding:10px 8px;border-radius:var(--r-s);text-decoration:none;font-size:var(--t-s)}
.res-busca a:hover,.res-busca a.sel{background:var(--papel-2)}
.res-busca a span{color:var(--grafite-2);font-size:var(--t-xs);margin-left:auto;white-space:nowrap}
.res-busca .vazio-b{padding:18px 8px;color:var(--grafite);font-size:var(--t-s)}

/* Biblioteca real */
a.linha-lv{color:inherit;text-decoration:none}
.bib-vazia{background:var(--cartao);border:1px dashed var(--linha-2);border-radius:var(--r-l);padding:40px 32px;text-align:center;max-width:620px;margin:24px auto}
.bib-vazia h2{margin:0 0 8px;font-size:var(--t-l)}
.bib-vazia p{color:var(--grafite);margin:0 0 20px;line-height:1.55}
.ad-origem{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin:4px 0 6px}
.linha-doi{display:flex;gap:8px}.linha-doi input{flex:1;min-width:0}
.linha3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.ficha{border-top:1px solid var(--linha);margin-top:16px;padding-top:16px}
.ficha label small{color:var(--grafite-2);font-weight:400;margin-left:6px}
.ad-msg{border-radius:var(--r-s);padding:9px 12px;font-size:var(--t-s);margin-top:12px;background:var(--papel-2)}
.ad-msg.ok{background:#E7F0E2;color:#2F5A24}.ad-msg.erro{background:#FBEDE8;color:#7A2E18}
.ref-previa{background:var(--papel-2);border-radius:var(--r-s);padding:10px 12px;margin-top:8px}
.ref-previa small{color:var(--grafite);font-size:var(--t-xs)}.ref-previa p{margin:4px 0 0;font-size:var(--t-s);line-height:1.5}
/* Fichamento real */
.fich-real{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.fich-real .citacao{border:1px solid var(--linha);border-radius:var(--r-m);padding:14px 16px;margin-bottom:12px;background:var(--papel)}
.fich-real .citacao.on{border-color:var(--petroleo)}
.fich-real .citacao blockquote{margin:0;border-left:4px solid;padding:2px 0 2px 12px;font-family:var(--leitura);line-height:1.55}
.fich-real .citacao .cit{font-size:var(--t-xs);color:var(--grafite);margin-top:6px}
.btn.mini{padding:2px 9px;font-size:var(--t-xs);margin-left:8px}
@media (max-width:1000px){.fich-real{grid-template-columns:minmax(0,1fr)}}

/* Leitor de PDF */
#pdf-palco{display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px 8px 60px}
.pdf-pagina{position:relative;background:#fff;box-shadow:0 2px 14px rgba(40,30,10,.12);border-radius:2px;flex:none}
.pdf-pagina canvas{display:block}
.pdf-num{position:absolute;top:-17px;right:0;font-size:11px;color:var(--grafite-2)}
.pdf-grifos{position:absolute;inset:0;z-index:2;pointer-events:none}
.pdf-grifo{position:absolute;mix-blend-mode:multiply;opacity:.55;border-radius:2px;pointer-events:auto;cursor:pointer}
.pdf-grifo.f-conceito{background:var(--hl-conceito)}.pdf-grifo.f-evidencia{background:var(--hl-evidencia)}.pdf-grifo.f-metodo{background:var(--hl-metodo)}.pdf-grifo.f-critica{background:var(--hl-critica)}.pdf-grifo.f-dissert{background:var(--hl-dissert)}
.pdf-aviso{max-width:520px;text-align:center;padding:40px 16px;color:var(--grafite)}
.pdf-aviso .btn{margin:6px 0 18px}
/* Camada de texto do PDF.js (selecionável e invisível sobre a página) */
.textLayer{position:absolute;text-align:initial;inset:0;overflow:clip;opacity:1;line-height:1;-webkit-text-size-adjust:none;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:1;--min-font-size:1;--text-scale-factor:calc(var(--total-scale-factor) * var(--min-font-size));--min-font-size-inv:calc(1 / var(--min-font-size))}
.textLayer :is(span,br){color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.textLayer > :not(.markedContent),.textLayer .markedContent span:not(.markedContent){z-index:1;--font-height:0;font-size:calc(var(--text-scale-factor) * var(--font-height));--scale-x:1;--rotate:0deg;transform:rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv))}
.textLayer .markedContent{display:contents}
.textLayer ::selection{background:rgba(31,74,90,.28);color:transparent}
.textLayer br::selection{background:transparent}
.textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:0;cursor:default;user-select:none}
.textLayer.selecting .endOfContent{top:0}
.pop-pdf,.menu-grifo{flex-direction:column;align-items:stretch;z-index:60;max-width:calc(100vw - 16px)}
.pop-pdf .linha-p,.menu-grifo .linha-p{flex-wrap:wrap}

/* Tela de entrada */
body.bloqueado aside.nav, body.bloqueado .tabbar{display:none!important}
body.bloqueado .app{grid-template-columns:1fr}
.entrar{min-height:100vh;display:grid;place-items:center;padding:32px 20px}
.entrar-caixa{max-width:420px;width:100%}
.entrar-caixa .wordmark{font-size:30px;padding:0;margin-bottom:28px}
.entrar-caixa h1{font-size:var(--t-xl);margin:0 0 10px}
.entrar-caixa p{color:var(--grafite);margin:0 0 22px;line-height:1.55}
.entrar-caixa .btn.prim{width:100%;justify-content:center;padding:13px 18px;font-size:var(--t-m)}
.entrar-nota{font-size:var(--t-xs);color:var(--grafite-2);margin:18px 0 0}
.entrar-erro{background:#FBEDE8;border:1px solid #E7B8A8;color:#7A2E18;border-radius:var(--r-s);padding:10px 12px;font-size:var(--t-s);margin:0 0 16px}
/* Situação do Drive no rodapé do menu */
.salvo.ok i{background:#5C8F4E}.salvo.aviso i{background:#C0702F}.salvo.erro i{background:#B0412B}
.salvo button{background:none;border:0;padding:0;color:var(--petroleo);font:inherit;text-decoration:underline;cursor:pointer}

/* Ajustes > Este aparelho */
.ap-grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.ap-it{background:var(--papel);border:1px solid var(--linha);border-radius:var(--r-s);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ap-it span{font-size:var(--t-xs);color:var(--grafite)}
.ap-it b{font-weight:500}
.ap-it small{font-size:var(--t-xs);color:var(--grafite-2);line-height:1.4}

/* Avisos fixos: versão nova, instalação no iPhone */
#avisos{position:fixed;right:24px;bottom:24px;z-index:70;display:flex;flex-direction:column;gap:10px;max-width:380px}
.aviso-fixo{background:var(--tinta);color:#fff;border-radius:var(--r-m);padding:14px 16px;box-shadow:0 8px 24px rgba(33,31,27,.18);font-size:var(--t-s);line-height:1.45}
.aviso-fixo p{margin:0 0 10px}
.aviso-fixo .bts{display:flex;gap:8px;flex-wrap:wrap}
.aviso-fixo .btn.prim{background:#fff;color:var(--tinta);border-color:#fff}
.aviso-fixo .btn.fant{color:#fff}
@media (max-width:1000px){#avisos{left:12px;right:12px;max-width:none;bottom:calc(76px + env(safe-area-inset-bottom))}}

/* Barra inferior (celular) */
.tabbar{display:none}
@media (max-width:1000px){
  aside.nav{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--papel);border-top:1px solid var(--linha);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--grafite);text-decoration:none;padding:4px 0}
  .tabbar a svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}
  .tabbar a.ativo{color:var(--petroleo-escuro);font-weight:600}
  main{padding-bottom:90px}
  .hoje-grid{grid-template-columns:1fr}
  .proximo{padding:24px}
  .subnav{overflow-x:auto}
  .linha-lv{grid-template-columns:1fr 110px}
  .linha-lv > :nth-child(3){display:none}
}
/* ============ v0.5: disciplina como central ============ */
.evs{display:flex;flex-direction:column}
.evs + h3{margin-top:22px!important}
.ev{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--linha)}
.evs .ev:first-child{border-top:0}
.ev-data{text-align:center;border:1px solid var(--linha-2);border-radius:var(--r-s);padding:4px 0;background:var(--papel)}
.ev-data b{display:block;font-size:var(--t-l);font-weight:500;line-height:1.1}
.ev-data span{font-size:11px;color:var(--grafite)}
.ev-t{font-weight:500}
.ev-m{font-size:var(--t-s);color:var(--grafite);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:3px}

.aulas{display:flex;flex-direction:column}

.aula-l:hover b{text-decoration:underline}
.aula-l b{display:block;font-weight:500}
.aula-l span{font-size:var(--t-s);color:var(--grafite)}
.n-a{width:30px;height:30px;border-radius:50%;border:1px solid var(--linha-2);display:grid;place-items:center;font-size:var(--t-s);color:var(--grafite)!important}
.st-a{font-size:var(--t-xs)!important;border-radius:999px;padding:3px 10px;background:var(--papel-2);color:var(--grafite)!important;white-space:nowrap}
.st-a.ok{background:#DDEBD6;color:#3F6E35!important}
.st-a.and{background:var(--petroleo-claro);color:var(--petroleo-escuro)!important}
.nota-rap{display:flex;gap:8px;margin-bottom:12px}
.nota-rap input{flex:1;min-width:0;border:1px solid var(--linha-2);border-radius:var(--r-s);padding:8px 10px;font-size:var(--t-s);background:#fff}
.notas-d{list-style:none!important;padding:0!important;margin:0;display:flex;flex-direction:column;gap:0!important}
.notas-d li{padding:10px 0;border-top:1px solid var(--linha);font-size:var(--t-s)}
.notas-d small{display:block;color:var(--grafite-2);font-size:var(--t-xs);margin-top:2px}
.aula-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:26px;align-items:start}
.doc.transcr{max-width:none;background:var(--cartao);border:1px solid var(--linha);border-radius:var(--r-l);padding:28px 34px;font-size:17.5px}

const DOC_HTML = `
<div class="cabeca">
<div class="aviso-demo">Texto de demonstração escrito para o protótipo. Não é o texto do artigo; na versão funcional, o PDF real aparece aqui.</div>
<h1>Pragmatism vs interpretivism in qualitative information systems research</h1>
<div class="autores">Göran Goldkuhl, European Journal of Information Systems, 2012</div>
</div>
<h2>1. A third position</h2>
<p>Qualitative research in information systems has long been framed as a choice between positivist and interpretive commitments. This framing leaves out a third tradition that has quietly shaped much of the field’s design-oriented work. Where interpretivism asks how actors make sense of their world, <mark class="conceito" data-id="g1">pragmatism asks what difference knowledge makes when it is put to use</mark>.</p>
<p>Three strands can be separated for analytical purposes. <mark class="conceito" data-id="g2">Functional pragmatism treats knowledge as an instrument for action.</mark> Referential pragmatism places action itself at the centre of what is studied. <mark class="metodo" data-id="g3" data-nota="1">Methodological pragmatism holds that we come to know the world by intervening in it and observing the consequences.</mark></p>
<div class="pag">p. 137</div>
<h2>2. Consequences for design-oriented research</h2>
<p>For design-oriented research, the consequence is significant. An artefact is not only an object to be described but a proposition about how a situation could be improved. Evaluating it therefore <mark class="dissert" data-id="g4">requires criteria declared before use, so that utility is not reconstructed after the fact</mark> to fit whatever results appeared.</p>
<p>This does not dissolve the interpretive concern with meaning. <mark class="critica" data-id="g5" data-nota="1">Users still interpret the artefact, and those interpretations shape whether it works.</mark> The difference lies in where the researcher anchors the claim: in the coherence of an account, or in the observable consequences of acting on it.</p>
<p>A pragmatist stance also changes how disagreement is handled. Instead of seeking agreement between independent observers as the main warrant, the researcher can ask <mark class="dissert" data-id="g6">whether repeated applications of the same procedure lead to stable, useful outcomes</mark> under comparable conditions.</p>
<div class="pag">p. 138</div>
<h2>3. Situating the debate</h2>
<p>None of this implies that pragmatism is free of tension. Its emphasis on usefulness invites the question of who defines what counts as useful, and for whom. A researcher who adopts it should be ready to make those choices explicit rather than leave them hidden inside the evaluation design.</p>
<p>The remainder of this paper examines how these positions differ in their view of knowledge, data and the role of the researcher, and what each offers to studies that build and evaluate artefacts in organisational settings.</p>
`;

    (f.etapa===null||l.etapa===f.etapa)&&(!b||(l.tit+l.aut+l.conc.join(' ')+l.tags.join(' ')).toLowerCase().includes(b)));
  const conta=(fn)=>LEITURAS.filter(fn).length;
  const opcoes={
    proj:PROJETOS.map(p=>[p.id,p.nome,conta(l=>l.proj===p.id)]),
    etapa:[0,1,2,3,4,5].map(e=>[e,rotEtapa(e),conta(l=>l.etapa===e)]),
    disc:DISCIPLINAS.map(d=>[d,d,conta(l=>l.disc===d)]),
    conc:[...new Set(LEITURAS.flatMap(l=>l.conc))].sort().map(c=>[c,c,conta(l=>l.conc.includes(c))]),
    tag:[...new Set(LEITURAS.flatMap(l=>l.tags))].sort().map(t=>[t,'#'+t,conta(l=>l.tags.includes(t))]),
  };
  const rotVal=(k,v)=>k==='proj'?P(v).nome:k==='etapa'?rotEtapa(v):k==='tag'?'#'+v:v;
  return `
  <div class="topo">
    <div><h1>Biblioteca</h1><p>${LEITURAS.length} leituras. Clique numa leitura para abrir no leitor.</p></div>
    <div class="acoes">

    </div>
  </div>
  <div class="filtros-barra" role="group" aria-label="Filtros">
    ${FACETAS.map(([k,n])=>`<details class="filtro ${f[k]!==null?'ativo':''}"><summary>${f[k]!==null?esc(rotVal(k,f[k])):n}</summary><div class="filtro-menu">${opcoes[k].map(([v,r,q])=>`<button class="${f[k]===v?'on':''}" data-faceta="${k}" data-valor="${esc(v)}">${r}<span class="q">${q}</span></button>`).join('')}</div></details>`).join('')}
    ${Object.values(f).some(v=>v!==null)?'<button class="btn fant" data-acao="limpar-filtros">Limpar filtros</button>':''}
  </div>
  <div class="tabela" role="table">
    <div class="linha-lv cab" role="row"><span>Leitura</span><span>Etapa</span><span>Progresso</span></div>
    ${lista.length?lista.map(l=>`
    <div class="linha-lv" role="row" tabindex="0" data-abrir="${l.id}">
      <div>
        <div class="tit">${esc(l.tit)}</div>
        <div class="aut">${esc(l.aut)}, ${l.ano??'s.d.'}. ${esc(l.veic)}</div>
        <div class="tags"><span class="chip proj"><span class="proj-dot" style="background:${P(l.proj).cor}"></span>${P(l.proj).nome}</span>${l.conc.map(c=>`<span class="chip">${c}</span>`).join('')}</div>
      </div>
      <div class="est"><span>${rotEtapa(l.etapa)}</span>${pips(l.etapa)}</div>
      <div class="prog">${l.pag}<small>${Object.values(l.hl).reduce((a,b)=>a+b,0)} grifos</small></div>
    </div>`).join(''):`<div class="vazio">Nenhuma leitura com esses filtros. <button class="btn" data-acao="limpar-filtros">Limpar filtros</button></div>`}
  </div>`;
};

function trilhaHTML(t){
  const feitos=t.itens.filter(i=>L(i).etapa>4);
  const abertos=t.itens.filter(i=>L(i).etapa<=4);
  const agora=abertos.find(i=>L(i).etapa>0)||abertos[0];
  const acaoDe=(i,l)=>l.etapa===0?['Começar pré-leitura',`#leitor/${i}`]:l.etapa===1?['Continuar pré-leitura',`#leitor/${i}`]:l.etapa===2?['Continuar leitura',`#leitor/${i}`]:l.etapa===3?['Abrir fichamento',`#fichamento/${i}`]:['Conectar a argumentos','#argumentos'];
  return `<section class="trilha">
    <header>
      <div><h2>${t.nome}</h2><p>${t.desc}. ${feitos.length} de ${t.itens.length} concluídas.</p></div>
      <div class="prazo ${t.urgente?'urgente':''}"><b>${t.prazo}</b><small>${t.falta}</small></div>
    </header>
    <ol class="seq">
      ${abertos.map(i=>{const l=L(i);const a=acaoDe(i,l);const cls=i===agora?'agora':'';
        return `<li class="${cls}"><div><div class="t">${esc(l.tit)}</div><div class="a">${citCurta(l)}, ${l.pag}</div></div>${pips(l.etapa)}<a class="btn ${cls?'prim':'fant'} acao" href="${a[1]}">${a[0]}</a></li>`}).join('')}
    </ol>
    ${feitos.length?`<details class="concluidas"><summary>Ver ${feitos.length} concluída${feitos.length>1?'s':''}</summary><ol class="seq feitas">${feitos.map(i=>{const l=L(i);return `<li><div><div class="t">${esc(l.tit)}</div><div class="a">${citCurta(l)}</div></div>${pips(l.etapa)}<a class="btn fant acao" href="#fichamento/${i}">Rever fichamento</a></li>`}).join('')}</ol></details>`:''}
  </section>`;
}

const GRIFOS_VEN = [

  const l=L(id)||L('venable2016'); const p=S.passoFich;
