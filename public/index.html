<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Segurança: o app só carrega código, estilos, fontes e imagens dele mesmo.
     Quando o login Google e o Gemini entrarem, os endereços do Google são acrescentados aqui, um a um. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://www.googleapis.com https://oauth2.googleapis.com https://api.crossref.org https://generativelanguage.googleapis.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>researchbook</title>
<meta name="theme-color" content="#FBFAF8">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="apple-mobile-web-app-title" content="researchbook">
<link rel="preload" href="fontes/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="app" id="app">
  <aside class="nav" aria-label="Navegação principal">
    <a href="#painel" class="wordmark"><span>researchbook</span></a>
    <ul id="menu"></ul>
    <div class="voce" id="voce"></div>
  </aside>
  <main id="vista" tabindex="-1"></main>
  <div class="status-movel" id="status-movel" role="status" aria-live="polite"></div>
  <nav class="tabbar" id="tabbar" aria-label="Navegação"></nav>
</div>

<div class="popover" id="pop" role="toolbar" aria-label="Grifar trecho"></div>
<div class="veu" id="veu" role="dialog" aria-modal="true" aria-labelledby="modal-tit"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/app.js"></script>
<script type="module" src="js/inicio.js"></script>
</body>
</html>
